<section id="studio" class="page active">
<div class="card"><span class="badge">VERIFIED BRIEF</span><div class="grid2"><label>विषय<input id="topic" oninput="upd()" placeholder="उदा. विकासकामाची पाहणी"></label><label>ठिकाण<input id="place" oninput="upd()"></label></div><div class="grid2"><label>दिनांक<input id="date" type="date" oninput="upd()"></label><label>पुढील पाऊल<input id="outcome"></label></div><label>पडताळलेली माहिती<textarea id="facts" rows="4" oninput="upd()"></textarea></label></div>

<div class="aipanel"><div class="progrid">

<div class="proctl"><b>Transitions</b><select id="transitionMode"><option value="auto">Auto</option><option value="clean">Clean</option><option value="dynamic">Dynamic</option></select></div>

<div class="proctl"><b>Music</b><div class="pro-note">Real uploaded music only · no generated instruments</div></div>
</div><div class="timeline-map"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="pro-note">Auto Director builds video-style edits from photos: subject cutouts, monochrome depth layers, parallax, rapid background swaps, motion and music-synced transitions.</div></div>
<label>Music / song / poem recording (optional — upload audio you can use)<input id="music" type="file" accept="audio/*"></label>
<div id="musicPlan" class="status">🎵 No music selected · reel will keep original video/speech audio only.</div>
<div class="chips" style="margin-top:8px"><label class="chip"><input type="radio" name="pace" value="dynamic" checked><span>⚡ Dynamic Reel</span></label><label class="chip"><input type="radio" name="pace" value="documentary"><span>🎞 Documentary</span></label></div>
<button class="primary" onclick="renderReel()">🎬 Generate Advanced Reel</button><div class="progress"><div id="bar"></div></div><div id="rs" class="status" hidden></div><div id="output" class="output"></div></div></section>
<section id="designs" class="page"><div class="card"><span class="badge">DESIGN LAB</span><h2>High-resolution social post</h2><div class="chips"><label class="chip"><input type="radio" name="pr" value="4:5" checked><span>Feed 4:5</span></label><label class="chip"><input type="radio" name="pr" value="1:1"><span>Square</span></label><label class="chip"><input type="radio" name="pr" value="9:16"><span>Story</span></label></div><button class="primary" onclick="poster()">🖼️ Generate Poster</button><div id="po" class="output"></div></div></section>
<section id="calendar" class="page"><div class="card"><span class="badge">2026 MAHARASHTRA</span><h2>सण आणि स्मरणदिन</h2><select id="mf" onchange="calendar()"><option value="">संपूर्ण वर्ष</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${new Date(2026,i,1).toLocaleString('mr-IN',{month:'long'})}</option>`).join('')}</select></div><div id="fg" class="festival-grid"></div></section>
</main><nav class="tabs"><button class="active" onclick="tab('studio',this)">🎬<br>Studio</button><button onclick="tab('designs',this)">◆<br>Designs</button><button onclick="tab('calendar',this)">📅<br>Calendar</button></nav>`;
document.getElementById('mediaInput').addEventListener('change',load);document.getElementById('music').addEventListener('change',e=>{musicFile=e.target.files[0]||null;previewMusicPlan()});calendar();upd();updateCompatibility();previewMusicPlan()}
function sb(s,n,d){return `<button class="style ${s==='cinematic'?'sel':''}" onclick="setStyle('${s}',this)"><span class="sw ${s}"></span><b>${n}</b><small>${d}</small></button>`}
function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function v(id){return(document.getElementById(id)?.value||'').trim()}function ch(n){return document.querySelector(`input[name="${n}"]:checked`)?.value}
function pal(){if(style==='documentary')return{a:'#285644',p:'rgba(238,233,220,.91)',t:'#1b2822',s:'#48554e',a1:'#eee8da',a2:'#b8c6bb'};if(style==='newsroom')return{a:'#e2b25b',p:'rgba(5,23,46,.91)',t:'#fff',s:'#d7e1ed',a1:'#05172e',a2:'#173f69'};if(style==='heritage')return{a:'#e29539',p:'rgba(82,22,29,.91)',t:'#fff7e8',s:'#efd2ad',a1:'#52161d',a2:'#8a2c22'};if(style==='minimal')return{a:'#171717',p:'rgba(247,247,243,.94)',t:'#111',s:'#555',a1:'#f7f7f3',a2:'#deded8'};return{a:'#c99a52',p:'rgba(13,13,14,.88)',t:'#fff',s:'#ded7d0',a1:'#0e0e0f',a2:'#493126'}}
function setStyle(s,b){style=s;document.querySelectorAll('.style').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');upd()}
function upd(){const p=pal(),pr=document.getElementById('preview');if(!pr)return;pr.style.background=`linear-gradient(145deg,${p.a1},${p.a2})`;pr.style.color=p.t;pr.querySelector('.rule').style.background=p.a;document.getElementById('pt').textContent=v('topic')||'तुमचा विषय';document.getElementById('pm').textContent=[v('place'),v('date')].filter(Boolean).join(' · ')||'ठिकाण · दिनांक'}
function detectFileType(f){
 const mime=(f.type||'').toLowerCase(),name=(f.name||'').toLowerCase();
 if(mime.startsWith('video/')||/\.(mp4|m4v|mov|webm|3gp|mkv)$/i.test(name))return 'video';
 if(mime.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(name))return 'image';
 return 'unknown'
}
function waitEvent(el,event,timeout=8000){
 return new Promise((resolve,reject)=>{
  let done=false;const finish=(ok,val)=>{if(done)return;done=true;clearTimeout(timer);el.removeEventListener(event,onOk);el.removeEventListener('error',onErr);ok?resolve(val):reject(val)};
  const onOk=()=>finish(true),onErr=()=>finish(false,new Error('Media could not be decoded on this device'));
  el.addEventListener(event,onOk,{once:true});el.addEventListener('error',onErr,{once:true});
  const timer=setTimeout(()=>finish(false,new Error('Media loading timed out')),timeout)
 })
}
function seekVideo(el,time,timeout=5000){
 return new Promise((resolve,reject)=>{
  let done=false;const finish=(ok,val)=>{if(done)return;done=true;clearTimeout(timer);el.removeEventListener('seeked',okFn);el.removeEventListener('error',errFn);ok?resolve(val):reject(val)};
  const okFn=()=>finish(true),errFn=()=>finish(false,new Error('Video seek failed'));
  el.addEventListener('seeked',okFn,{once:true});el.addEventListener('error',errFn,{once:true});
  const timer=setTimeout(()=>finish(false,new Error('Video seek timed out')),timeout);
  try{el.currentTime=Math.max(0,time)}catch(err){finish(false,err)}
 })
}
function makeVideoThumb(video){
 try{
  const sw=video.videoWidth||720,sh=video.videoHeight||1280,max=480,scale=Math.min(1,max/Math.max(sw,sh)),cv=document.createElement('canvas');
  cv.width=Math.max(2,Math.round(sw*scale));cv.height=Math.max(2,Math.round(sh*scale));
  cv.getContext('2d').drawImage(video,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.78)
 }catch{return ''}
}
async function inspectVideo(item){
 const x=document.createElement('video');x.preload='metadata';x.muted=true;x.playsInline=true;x.src=item.url;
 await waitEvent(x,'loadedmetadata',10000);item.dur=Number.isFinite(x.duration)?x.duration:0;item.w=x.videoWidth;item.h=x.videoHeight;
 try{
  if(item.dur>.15){await seekVideo(x,Math.min(Math.max(.05,item.dur*.08),Math.max(.05,item.dur-.12)),5000)}
  item.thumb=makeVideoThumb(x);if(item.thumb&&!firstImage)firstImage=item.thumb
 }catch{}
 item.ready=true
}
async function inspectImage(item){
 const im=new Image();im.src=item.url;
 if(im.decode)await Promise.race([im.decode(),new Promise((_,j)=>setTimeout(()=>j(new Error('Image loading timed out')),8000))]);
 else await waitEvent(im,'load',8000);
 item.w=im.naturalWidth;item.h=im.naturalHeight;item.thumb=item.url;item.ready=true;if(!firstImage)firstImage=item.url
}
async function load(e){
 const files=[...(e.target.files||[])];
 if(!files.length)return;
 items.forEach(x=>{try{URL.revokeObjectURL(x.url)}catch{}});items=[];firstImage='';renderBlob=null;
 const accepted=files.slice(0,24);
 items=accepted.map(f=>({f,url:URL.createObjectURL(f),type:detectFileType(f),score:50,dur:0,ready:false,error:'',thumb:'',focus:false,faces:0,ocr:'',relevance:0,focal:null,aiScanned:false,cutout:null,cutoutReady:false,priority:detectFileType(f)==='video'?2:1}));
 draw();
 const hint=document.getElementById('mediaHint'),st=document.getElementById('analysisStatus');st.hidden=false;st.className='status';
 st.textContent=`Selected ${items.length} file(s). Checking media compatibility…`;
 await Promise.all(items.map(async item=>{
  try{
   if(item.type==='video')await inspectVideo(item);
   else if(item.type==='image')await inspectImage(item);
   else throw new Error('Unsupported file type')
  }catch(err){item.error=(err&&err.message)||'Unsupported media';item.ready=false;item.score=0}
 }));
 draw();
 const usable=items.filter(x=>x.ready&&!x.error).length,failed=items.length-usable;
 if(hint)hint.textContent=`${usable} usable media selected${failed?` · ${failed} file(s) could not be decoded`:''}.`;
 st.className=usable?'status ok':'status';
 st.textContent=usable?`Media loaded: ${usable}/${items.length}. Analyzing quality and story…`:'The selected media could not be decoded. Try an MP4 (H.264) or another phone video.';
 if(usable){
  await analyze(false);
  await runLocalAI();
  st.className='status ok';
  st.textContent='Media ready · quality ranked · story analysis complete.';
 }
}
function resetMedia(){
 items.forEach(x=>{try{URL.revokeObjectURL(x.url)}catch{}});items=[];firstImage='';renderBlob=null;
 const input=document.getElementById('mediaInput');if(input)input.value='';
 const hint=document.getElementById('mediaHint');if(hint)hint.textContent='No media selected yet.';
 const st=document.getElementById('analysisStatus');if(st){st.hidden=true;st.textContent=''}
 document.getElementById('media').innerHTML='';
 const pr=document.getElementById('preview');pr?.querySelector('img')?.remove()
}
function draw(){
 const box=document.getElementById('media');if(!box)return;
 box.innerHTML=items.map((x,i)=>{
